# Gera o APK Android (ChatMil.apk) a cada envio para a branch main
# e publica em "Releases" do repositório, pronto para baixar no celular.
name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar o app
        run: |
          npm install --no-audit --no-fund
          pip install --quiet pillow
          python3 tools/build.py node_modules

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Recursos do Android (imprimir, abrir com, salvar, TV, bloqueio de print, câmera e microfone)
        run: |
          cp android-extra/*.java android/app/src/main/java/br/com/senov/provas/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' $M
          grep -c "RECORD_AUDIO" $M

      - name: Chamadas com o app fechado (serviço, notificação de chamada, Firebase nativo)
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = ["POST_NOTIFICATIONS", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_SPECIAL_USE", "USE_FULL_SCREEN_INTENT",
                   "SYSTEM_ALERT_WINDOW", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", "RECEIVE_BOOT_COMPLETED", "WAKE_LOCK", "VIBRATE", "ACCESS_NETWORK_STATE",
                   "ACCESS_COARSE_LOCATION", "ACCESS_FINE_LOCATION"]
          extra = "".join(f'    <uses-permission android:name="android.permission.{x}" />\n' for x in perms if f"android.permission.{x}\"" not in s)
          s = s.replace("<application", extra + "\n    <application", 1)
          comp = """
                  <service android:name=".ChamadasService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Receber chamadas de voz e video do ChatMil com o app fechado" />
                  </service>
                  <receiver android:name=".ChamadaAcaoReceiver" android:exported="false" />
                  <activity android:name=".CameraActivity" android:exported="false" android:theme="@style/AppTheme.NoActionBar" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden" />
                  <receiver android:name=".InicioReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
          """
          assert "</application>" in s
          s = s.replace("</application>", comp + "    </application>", 1)
          open(p, "w").write(s)
          g = "android/app/build.gradle"
          t = open(g).read()
          dep = """
          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'androidx.camera:camera-core:1.4.2'
              implementation 'androidx.camera:camera-camera2:1.4.2'
              implementation 'androidx.camera:camera-lifecycle:1.4.2'
              implementation 'androidx.camera:camera-video:1.4.2'
              implementation 'androidx.camera:camera-view:1.4.2'
              implementation 'androidx.media3:media3-transformer:1.8.0'
              implementation 'androidx.media3:media3-effect:1.8.0'
              implementation 'androidx.media3:media3-common:1.8.0'
          }
          """
          t = t + "\n" + dep
          open(g, "w").write(t)
          PY
          grep -n "ChamadasService\|CameraActivity\|FOREGROUND_SERVICE\|USE_FULL_SCREEN\|LOCATION" android/app/src/main/AndroidManifest.xml
          grep -n "AppTheme.NoActionBar" android/app/src/main/res/values/styles.xml
          tail -8 android/app/build.gradle

      - name: Assinatura sempre igual (atualizações instalam por cima) e versão final mais leve
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          assin = """
              signingConfigs {
                  chatmil {
                      storeFile rootProject.file("../android-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          """
          assert "buildTypes {" in s
          s = s.replace("    buildTypes {", assin + "    buildTypes {", 1)
          s = re.sub(r"(release \{\s*\n)", r"\1            signingConfig signingConfigs.chatmil\n", s, count=1)
          assert "signingConfig signingConfigs.chatmil" in s
          open(p, "w").write(s)
          PY
          grep -n "signingConfig\|storeFile" android/app/build.gradle

      - name: Ícone e tela de abertura
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#2447C6' --iconBackgroundColorDark '#2447C6' --splashBackgroundColor '#F2F4F9' --splashBackgroundColorDark '#0C1120'

      - name: Número da versão
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../ChatMil.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs ../ChatMil.apk | head -5 || true

      - uses: actions/upload-artifact@v4
        with:
          name: ChatMil-apk
          path: ChatMil.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: ChatMil — versão de teste ${{ github.run_number }}
          body: |
            APK de teste do ChatMil.
            No celular: baixe **ChatMil.apk** abaixo, abra o arquivo e permita "instalar apps desconhecidos".
          prerelease: true
          files: ChatMil.apk
