<title>ChatSenov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#E9EDF6; --ink:#141C33; --muted:#56627E; --line:#D8DEEA;
  --primary:#2447C6; --primary-ink:#FFFFFF; --primary-soft:#E2E8FC; --margin:#D23F58;
  --ok:#1D8657; --ok-soft:#DDF3E8; --warn:#A96400; --warn-soft:#FBEBD2; --danger:#C0303D; --danger-soft:#FBE1E3;
  --paper:#FFFFFF; --paper-ink:#121212; --paper-rule:#CFDBF3;
  --shadow:0 1px 2px rgba(20,28,51,.06),0 10px 28px rgba(20,28,51,.07);
  --r:16px; --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1120; --surface:#141B2D; --surface-2:#1C2540; --ink:#E7ECF8; --muted:#9BA6C2; --line:#29344F;
  --primary:#8FAAFF; --primary-ink:#0C1120; --primary-soft:#1D2950; --margin:#FF7189;
  --ok:#52C98F; --ok-soft:#133526; --warn:#F2AA4C; --warn-soft:#3A2A12; --danger:#FF717B; --danger-soft:#3D1A1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0C1120; --surface:#141B2D; --surface-2:#1C2540; --ink:#E7ECF8; --muted:#9BA6C2; --line:#29344F;
  --primary:#8FAAFF; --primary-ink:#0C1120; --primary-soft:#1D2950; --margin:#FF7189;
  --ok:#52C98F; --ok-soft:#133526; --warn:#F2AA4C; --warn-soft:#3A2A12; --danger:#FF717B; --danger-soft:#3D1A1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800} h2{font-size:1.3rem;font-weight:700} h3{font-size:1.05rem;font-weight:700}
p{margin:0}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Shell */
.app{min-height:100%;display:flex;flex-direction:column}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:45;pointer-events:none}
.sheet>*{flex-shrink:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;min-width:0;font-family:var(--display);font-weight:800;font-size:1.1rem}
.brand-mark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;position:relative;overflow:hidden}
.brand-mark::after{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--margin)}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.topbar .spacer{flex:1}
@media (max-width:420px){.who{display:none}}
.who{font-size:.8rem;color:var(--muted);text-align:right}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--muted);cursor:pointer;min-height:60px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--primary);font-weight:700}
.nav button[aria-current="page"] .ico{background:var(--primary-soft)}
.nav .ico{padding:3px 16px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
@media (min-width:900px){
  .nav{top:0;right:auto;width:96px;border-top:0;border-right:1px solid var(--line);padding-top:84px}
  .nav-in{grid-template-columns:1fr;gap:6px}
  .app{padding-left:96px}
  main{padding-block:24px 48px}
}

/* Blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.hero p{color:var(--muted);max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigact{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:120px}
.bigact.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.bigact svg{width:28px;height:28px}
.bigact b{font-family:var(--display);font-size:1.08rem}
.bigact span{font-size:.84rem;opacity:.85}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;text-decoration:none}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--primary)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:20px;height:20px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9rem}
label.f .hint{font-weight:400;color:var(--muted);font-size:.8rem}
.in,select.in,textarea.in{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-weight:400}
textarea.in{min-height:110px;resize:vertical;line-height:1.45}
.in:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:700;color:var(--muted);padding:0 10px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.switch input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{transform:translateX(18px)}
.switch .t b{display:block}
.switch .t span{font-size:.82rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:.88rem;cursor:pointer;font-weight:700}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;font-size:.75rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.aee{background:var(--primary-soft);color:var(--primary)}
.pill.d1{background:var(--ok-soft);color:var(--ok)} .pill.d2{background:var(--warn-soft);color:var(--warn)} .pill.d3{background:var(--danger-soft);color:var(--danger)}
.pill.mine{background:transparent;border:1px solid var(--line)}
.dots{display:inline-flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.25}.dots i.on{opacity:1}

/* Lists */
.qlist{display:flex;flex-direction:column;gap:10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%}
.qcard:hover{border-color:var(--primary)}
.qcard .meta{display:flex;flex-wrap:wrap;gap:6px}
.qcard .txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qcard.sel{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.empty{text-align:center;padding:28px 16px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--display);font-size:1.1rem}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:.9rem;align-items:flex-start}
.notice.info{background:var(--primary-soft)}
.notice.bad{background:var(--danger-soft)}
.notice svg{flex:none;width:20px;height:20px;margin-top:2px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters select{min-height:40px;border-radius:99px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:.88rem;font-weight:700;flex:none}

/* Wizard */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.step{display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--muted);font-weight:700;background:none;border:0;text-align:left;cursor:pointer;padding:0}
.step::before{content:"";height:5px;border-radius:99px;background:var(--line)}
.step.done::before,.step.cur::before{background:var(--primary)}
.step.cur{color:var(--ink)}
.bar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:10}
.bar .btn{flex:1}
@media (min-width:900px){.bar{bottom:16px}}
.selitem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.selitem .n{font-family:var(--display);font-weight:800;min-width:26px;color:var(--primary)}
.selitem .body{flex:1;min-width:0}
.selitem .body p{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
.logo-drop{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px dashed var(--line);border-radius:14px;cursor:pointer;background:var(--surface)}
.logo-drop .lg{width:64px;height:64px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;flex:none}
.logo-drop .lg img{max-width:100%;max-height:100%;object-fit:contain}
.dist{display:flex;gap:6px;flex-wrap:wrap}
.dist span{font-variant-numeric:tabular-nums;font-weight:700;background:var(--surface-2);border-radius:8px;padding:4px 10px;font-size:.88rem}

/* Paper preview */
.paper-wrap{padding:2px}
.paper{--pf:"Arimo",Arial,Helvetica,sans-serif;background:#fff;color:#141414;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 32px rgba(20,28,51,.14);padding:clamp(22px,9%,68px) clamp(16px,6%,46px) clamp(18px,6%,46px) clamp(20px,9%,68px);max-width:794px;margin:0 auto;position:relative;font-family:var(--pf);font-size:clamp(13px,1.9vw,15.5px);line-height:1.5}
.paper .pnum{position:absolute;top:clamp(12px,4.5%,40px);right:clamp(16px,6%,46px);font-size:.8em}
.paper.bastao{text-transform:uppercase;font-size:clamp(14px,2.2vw,17.5px);letter-spacing:.02em}
.ph{display:flex;flex-direction:column;gap:12px}
.ph-top{display:flex;gap:14px;align-items:center;padding-bottom:10px;border-bottom:2px solid #141414}
.ph-logo{width:62px;height:62px;display:grid;place-items:center;flex:none}
.ph-logo img{max-width:100%;max-height:100%;object-fit:contain}
.ph-escola{font-weight:700;font-size:1em;letter-spacing:.01em}
.ph-meta{font-size:.84em;color:#555;line-height:1.4;margin-top:2px}
.ph-line{display:flex;gap:6px;align-items:flex-end;font-size:.84em}
.ph-line b{font-weight:700;text-transform:none}
.ph-line .l{flex:1;border-bottom:1px solid #888;min-height:1.25em;padding-left:4px}
.ph-lines{display:flex;flex-direction:column;gap:10px;padding-bottom:10px;border-bottom:1px solid #141414}
.ph-row{display:flex;gap:16px;flex-wrap:wrap}.ph-row .ph-line{flex:1;min-width:90px}
.ptit{font-family:var(--pf);font-size:1em;font-weight:700;text-align:center;margin:1.4em 0 .6em;letter-spacing:.01em}
.p-instr{font-size:.84em;text-align:justify;line-height:1.35;margin-bottom:.8em}
.pq{margin-top:1em;break-inside:avoid}
.paper.cols2 .qs{column-count:2;column-gap:28px;column-rule:1px solid #ccc}
.paper.cols2 .pq:first-child{margin-top:0}
@media (max-width:560px){.paper.cols2{font-size:11.5px}.paper.cols2.bastao{font-size:12.5px}}
.pq .en{display:flex;gap:.5em;white-space:pre-wrap}
.pq .en span,.pq ol li span{text-align:justify;hyphens:auto;-webkit-hyphens:auto;flex:1}
.pq .en b{flex:none}
.pq ol{list-style:none;margin:.3em 0 0 1.7em;padding:0;display:flex;flex-direction:column}
.pq ol li{display:flex;gap:.45em}.pq ol li b{flex:none;min-width:1.4em}
.pgab{margin-top:2em;border-top:2px dashed #aaa;padding-top:1.2em;text-transform:none}
.pgab h3{font-family:var(--pf);font-size:1em;text-align:center}
.pgab>span{display:block;text-align:center;color:#666}
.gabgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;margin-top:10px}
.gabgrid div{border:1px solid #999;border-radius:5px;display:flex;justify-content:space-between;padding:3px 8px;font-variant-numeric:tabular-nums;font-size:.9em}
.gabgrid div b{font-size:1.05em}

/* Sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 0;flex:none}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-8px;background:var(--surface);padding:8px 0;z-index:2}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88%}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.alt-row{display:flex;gap:8px;align-items:center}
.alt-row .lt{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800;cursor:pointer;flex:none;background:var(--surface)}
.alt-row .lt[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.alt-row .in{min-height:44px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:80;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:up .2s}
.barchart{display:flex;flex-direction:column;gap:8px}
.barchart .r{display:grid;grid-template-columns:minmax(90px,150px) 1fr 36px;gap:8px;align-items:center;font-size:.86rem}
.barchart .t{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.barchart .t i{display:block;height:100%;background:var(--primary);border-radius:99px}
.barchart .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.aeebox{border-color:color-mix(in srgb,var(--primary) 45%,var(--line));background:linear-gradient(var(--primary-soft),var(--surface) 70%)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;width:100%}
.opt:hover:not([disabled]){border-color:var(--primary)}
.opt[disabled]{opacity:.55;cursor:not-allowed}
.opt>svg{width:22px;height:22px;flex:none;color:var(--primary);margin-top:2px}
.opt b{display:block}.opt span span{font-size:.84rem;color:var(--muted)}
.orient{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.orient summary{font-weight:700;cursor:pointer;color:var(--primary)}
.orient ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.origbox{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.origbox ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.origbox li.ok{color:var(--ok);font-weight:700}
.imgbox{position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;display:flex;justify-content:center}
.imgbox img{max-height:220px;max-width:100%;min-width:0;object-fit:contain}
.imgbox .iconbtn{position:absolute;top:6px;right:6px}
.qthumb{max-height:90px;max-width:160px;border-radius:8px;border:1px solid var(--line);background:#fff;object-fit:contain}
.qimg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;align-self:flex-start;max-height:260px;object-fit:contain}
img[data-img]:not([src]){min-height:80px;min-width:120px;background:var(--surface-2)}
.fotofalta{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:90px;min-width:160px;padding:10px;border:1.5px dashed #999;border-radius:8px;color:#777;font-size:.8rem;background:#fafafa}
.fotofalta svg{width:24px;height:24px}
.revdoc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;line-height:1.55}
.revdoc p{white-space:pre-wrap}
.revdoc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.revdoc li.ok b{color:var(--ok)}
del{background:var(--danger-soft);color:var(--danger);text-decoration:line-through;border-radius:3px;padding:0 2px}
ins{background:var(--ok-soft);color:var(--ok);text-decoration:none;border-radius:3px;padding:0 2px;font-weight:700}
.notice.okk{background:var(--ok-soft)}
.revload{display:flex;gap:14px;align-items:center;padding:18px 4px}

<script>
"use strict";
/* ============ Constantes ============ */
const DISCIPLINAS=["Língua Portuguesa","Matemática","Ciências","História","Geografia","Arte","Educação Física","Língua Inglesa","Ensino Religioso","Biologia","Física","Química","Filosofia","Sociologia"];

const NALT={EF:4,EM:5};
const LET="ABCDE";
const DIF={1:"Fácil",2:"Médio",3:"Difícil"};
const BIM=["1º bimestre","2º bimestre","3º bimestre","4º bimestre"];
const DISTR={equilibrada:{1:.3,2:.5,3:.2},faceis:{1:.6,2:.3,3:.1},desafio:{1:.2,2:.4,3:.4}};

const I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 bank:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
 prova:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M12 12v6M9 15h6"/></svg>',
 school:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',
 down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
 shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
 wand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8 19 13M17.8 6.2 19 5M12.2 6.2 11 5M3 21l9-9"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
 image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
 chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
 chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>',
 send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>',
 save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h8M7 21v-7h10v7"/></svg>'
};

/* ============ Estado ============ */
const S={
  db:null, user:null, uid:null, isOwner:false, canWrite:null, dl:null, ready:false,
  questoes:[], perfil:{escola:"",logo:"",logoR:1,professor:"",termoAceitoEm:null},
  provas:[], tab:"inicio",
  f:{nivel:"",disciplina:"",dif:"",aee:false,minhas:false,busca:""},
  prova:null, passo:1, auto:{conteudos:[],qtd:10,distr:"equilibrada",mesmaSerie:true}
};
try{const t=localStorage.getItem("senov.tab"); if(t) S.tab=t; const f=JSON.parse(localStorage.getItem("senov.f")||"null"); if(f) Object.assign(S.f,f);}catch(e){}
function lembrar(){try{localStorage.setItem("senov.tab",S.tab);localStorage.setItem("senov.f",JSON.stringify(S.f));}catch(e){}}

/* ============ Utilidades ============ */
/* Explicações ficam escondidas atrás de um botão "?" e abrem só quando o professor toca */
const DICAS=new Set();
const dh=k=>DICAS.has(k)?"":"hidden";
function ajuda(k,txt){return `<button type="button" class="ajuda-btn" data-a="dica" data-k="${k}" aria-expanded="${DICAS.has(k)}" aria-label="Explicação">?</button><span class="dica-txt" data-k="${k}" ${dh(k)}>${txt}</span>`;}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const uniq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,"pt-BR"));
const agora=()=>new Date().toISOString();
const dataBR=iso=>{try{return new Date(iso).toLocaleDateString("pt-BR")}catch(e){return ""}};
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
function dots(d){return `<span class="dots">${[1,2,3].map(i=>`<i class="${i<=d?"on":""}"></i>`).join("")}</span>`;}
function difPill(d){return `<span class="pill d${d}">${dots(d)} ${DIF[d]}</span>`;}
S._banco=[];S._privadas=[];
function juntar(){S.questoes=[...S._banco,...S._privadas];render();}
const colPrivadas=()=>S.db.doc(`data/users/${S.uid}/perfil`).collection("minhas");
function mine(q){return S.uid && q.autorId===S.uid;}
function todasDisciplinas(){return uniq([...DISCIPLINAS,...S.questoes.map(q=>q.disciplina)]);}
function conteudosDe(disc,nivel,serie){return uniq(S.questoes.filter(q=>(!disc||q.disciplina===disc)&&(!nivel||q.nivel===nivel)&&(!serie||q.serie===serie)).map(q=>q.conteudo));}

/* ============ Dados (db) ============ */
async function iniciar(){
  render();
  const c=window.claude;
  if(!c||!c.use){S.ready=true;render();return;}
  const [db,user,dl,sm]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads"),c.use("sample")]);
  S.db=db;S.user=user;S.dl=dl;S.sample=sm;
  if(user){S.uid=await user.id();S.isOwner=await user.isOwner();S.canWrite=await user.can("data.write");}
  S.ready=true;
  if(db){
    db.collection("questoes").onSnapshot(snap=>{S._banco=snap.docs.map(d=>({id:d.id,...d.data()}));juntar();},e=>{console.warn(e);toast("Não foi possível carregar o banco de questões.");});
    if(S.uid){
      db.doc(`data/users/${S.uid}/perfil`).onSnapshot(s=>{if(s.exists)S.perfil={...S.perfil,...s.data()};render();});
      db.doc(`data/users/${S.uid}/perfil`).collection("minhas").onSnapshot(snap=>{S._privadas=snap.docs.map(d=>({id:d.id,...d.data(),privada:true}));juntar();});
      db.doc(`data/users/${S.uid}/perfil`).collection("provas").onSnapshot(snap=>{S.provas=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.atualizadoEm||"").localeCompare(a.atualizadoEm||""));render();});
    }
  }
  render();
}
let salvandoPerfil=Promise.resolve();
function salvarPerfil(patch){
  Object.assign(S.perfil,patch);
  if(!S.db||!S.uid){render();return Promise.resolve();}
  const body={...S.perfil};
  salvandoPerfil=salvandoPerfil.then(()=>S.db.doc(`data/users/${S.uid}/perfil`).set(body)).catch(e=>{console.warn(e);toast("Não foi possível salvar seus dados.");});
  return salvandoPerfil;
}
function podeGravar(){return !!(S.db&&S.uid&&S.canWrite!==false);}

/* ============ Termo de autorização ============ */
const TERMO_V=2;
const TEXTO_TAXA="O acesso às questões de todos os professores (<b>banco completo</b>) terá uma taxa para cobrir os custos do site e da plataforma. Valor e forma de pagamento serão informados antes de qualquer cobrança. Durante os testes, o acesso está liberado.";
function termoOk(){return !!(S.perfil.termoAceitoEm&&(S.perfil.termoVersao||1)>=TERMO_V);}
function exigirTermo(){
  return new Promise(res=>{
    if(termoOk()) return res(true);
    abrirSheet(`
      <div class="sheet-h"><h2>Autorização de compartilhamento</h2></div>
      <p>Você usa o ChatSenov sem custo. Em troca, autoriza o compartilhamento das questões que cadastrar.</p>
      <div class="notice info">${I.info}<div class="stack" style="gap:6px">

async function revisarIA(d){

- há erro de conteúdo (conceito errado) que exige o professor decidir;

QUESTÃO:
${textoQuestao(d,true)}

Responda SOMENTE com JSON neste formato:
{"status":"ok"|"ajustada"|"bloqueada","enunciado":string,"alternativas":[${n} strings sem a letra],"correta":número de 0 a ${n-1},"alteracoes":[{"onde":"Enunciado" ou "Alternativa A".."E","motivo":frase curta}],"problemas":[frases curtas explicando o bloqueio, vazio se não bloqueada]}
Use "ok" quando nada precisar mudar (repita o texto original exatamente).`;
  const r=await S.sample.json(pedido,{modelTier:"complex"});

async function conferirIA(q){

  const r=await S.sample.json(pedido);

function difPalavras(a,b){
  const A=String(a).split(/(\s+)/),B=String(b).split(/(\s+)/);
  if(A.length*B.length>90000)return a===b?esc(b):`<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  const L=Array.from({length:A.length+1},()=>new Int32Array(B.length+1));
  for(let i=A.length-1;i>=0;i--)for(let j=B.length-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,out="";
  while(i<A.length&&j<B.length){if(A[i]===B[j]){out+=esc(A[i]);i++;j++;}else if(L[i+1][j]>=L[i][j+1]){if(A[i].trim())out+=`<del>${esc(A[i])}</del>`;else out+=esc(A[i]);i++;}else{if(B[j].trim())out+=`<ins>${esc(B[j])}</ins>`;else out+=esc(B[j]);j++;}}
  while(i<A.length){if(A[i].trim())out+=`<del>${esc(A[i])}</del>`;i++;}
  while(j<B.length){out+=B[j].trim()?`<ins>${esc(B[j])}</ins>`:esc(B[j]);j++;}
  return out;
}

/* ============ Seleção automática e organização ============ */
function filtrarBase(p,mesmaSerie,conteudos){
  return S.questoes.filter(q=>q.nivel===p.nivel&&q.disciplina===p.disciplina&&(!mesmaSerie||q.serie===p.serie)&&(!conteudos.length||conteudos.includes(q.conteudo))&&Array.isArray(q.alternativas)&&q.alternativas.length===NALT[p.nivel]);
}
function montarAuto(){
  const p=S.prova,a=S.auto;
  let base=filtrarBase(p,a.mesmaSerie,a.conteudos);
  if(p.aee){
    const perfil=base.filter(q=>q.aee||q.dificuldade===1);
    if(!perfil.length) return {erro:"aee"};
    const pri=shuffle(perfil.filter(q=>q.aee)), sec=shuffle(perfil.filter(q=>!q.aee));
    const sel=[...pri,...sec].slice(0,a.qtd);
    return {sel,falta:Math.max(0,a.qtd-sel.length)};
  }
  if(!base.length) return {erro:"vazio"};
  const alvo=DISTR[a.distr]; const b={1:shuffle(base.filter(q=>q.dificuldade===1)),2:shuffle(base.filter(q=>q.dificuldade===2)),3:shuffle(base.filter(q=>q.dificuldade===3))};
  const sel=[];
  [1,2,3].forEach(d=>{const n=Math.round(a.qtd*alvo[d]);sel.push(...b[d].splice(0,n));});
  const resto=shuffle([...b[1],...b[2],...b[3]]);
  while(sel.length<a.qtd&&resto.length) sel.push(resto.shift());
  return {sel:sel.slice(0,a.qtd),falta:Math.max(0,a.qtd-sel.length)};
}
/* Sequência do gabarito: equilibrada, sem letras repetidas em seguida, sem padrões ABAB nem ABC/CBA */
function sequenciaGabarito(n,k,fixos){
  const valido=(seq,i,c,relax)=>{
    if(i>0&&seq[i-1]===c) return false;
    if(fixos[i+1]!=null&&fixos[i+1]===c) return false;
    if(relax) return true;
    if(i>2&&seq[i-2]===c&&seq[i-1]===seq[i-3]) return false;
    if(i>1){const x=seq[i-2],y=seq[i-1];if((y-x===1&&c-y===1)||(x-y===1&&y-c===1))return false;}
    return true;
  };
  for(let t=0;t<4000;t++){
    const relax=t>3000;
    const cnt=Array(k).fill(Math.floor(n/k));
    shuffle([...Array(k).keys()]).slice(0,n%k).forEach(i=>cnt[i]++);
    fixos.forEach(f=>{if(f!=null)cnt[f]--;});
    let neg=0;cnt.forEach((v,i)=>{if(v<0){neg-=v;cnt[i]=0;}});
    while(neg>0){let m=cnt.indexOf(Math.max(...cnt));if(cnt[m]<=0)break;cnt[m]--;neg--;}
    const seq=[];let ok=true;
    for(let i=0;i<n;i++){
      if(fixos[i]!=null){seq[i]=fixos[i];continue;}
      const cand=[];cnt.forEach((v,c)=>{if(v>0&&valido(seq,i,c,relax))for(let w=0;w<v;w++)cand.push(c);});
      if(!cand.length){ok=false;break;}
      const c=cand[Math.floor(Math.random()*cand.length)];seq[i]=c;cnt[c]--;
    }
    if(ok) return seq;
  }
  return Array.from({length:n},(_,i)=>fixos[i]??(i%k));
}
function entrada(q,pos){
  let ordem;
  if(q.fixarOrdem||pos==null) ordem=q.alternativas.map((_,j)=>j);
  else{const outros=shuffle(q.alternativas.map((_,j)=>j).filter(j=>j!==q.correta));ordem=[];let o=0;for(let p=0;p<q.alternativas.length;p++)ordem[p]=p===pos?q.correta:outros[o++];}
  return {qid:q.id,grafico:q.grafico||null,temFoto:!!q.temFoto,legenda:q.legenda||"",tituloImg:q.tituloImg||"",enunciado:q.enunciado,alternativas:ordem.map(j=>q.alternativas[j]),correta:ordem.indexOf(q.correta),dificuldade:q.dificuldade,conteudo:q.conteudo};
}
/* Refaz só as letras do gabarito, mantendo a ordem das questões */
function reletrar(lista,nivel){
  const fixos=lista.map(q=>q.fixarOrdem?q.correta:null);
  const seq=sequenciaGabarito(lista.length,NALT[nivel],fixos);
  return lista.map((q,i)=>entrada(q,seq[i]));
}
function organizar(itens,nivel){
  const ordemCont=[];itens.forEach(q=>{if(!ordemCont.includes(q.conteudo))ordemCont.push(q.conteudo);});
  const emb=shuffle(itens);
  emb.sort((a,b)=>(a.dificuldade-b.dificuldade)||(ordemCont.indexOf(a.conteudo)-ordemCont.indexOf(b.conteudo)));
  return reletrar(emb,nivel);
}
function itemDe(qid){return (S.prova&&S.prova.itens.find(q=>q.id===qid))||S.questoes.find(q=>q.id===qid);}
function candidatosTroca(qid){
  const p=S.prova,atual=itemDe(qid);if(!atual)return [];
  const usados=new Set(p.itens.map(q=>q.id));
  let c=S.questoes.filter(q=>!usados.has(q.id)&&q.nivel===p.nivel&&q.disciplina===p.disciplina&&Array.isArray(q.alternativas)&&q.alternativas.length===NALT[p.nivel]);
  if(p.aee)c=c.filter(q=>q.aee||q.dificuldade===1);
  const nota=q=>(q.serie===p.serie?4:0)+(q.conteudo===atual.conteudo?3:0)+(q.dificuldade===atual.dificuldade?2:0)+(p.aee&&q.aee?1:0)+Math.random()*.5;
  return c.map(q=>[nota(q),q]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
}
function trocarQuestao(qid){
  const p=S.prova,c=candidatosTroca(qid);
  if(!c.length){toast("Não há outra questão parecida no banco para trocar.");return;}
  const nova=c[0],k=p.itens.findIndex(q=>q.id===qid);
  if(k>=0)p.itens[k]=nova;
  const ordem=p.montagem.map(m=>m.qid===qid?nova:itemDe(m.qid)).filter(Boolean);
  p.montagem=reletrar(ordem,p.nivel);
  toast(nova.conteudo===(itemDe(qid)||{}).conteudo?"Questão trocada por outra do mesmo conteúdo.":"Questão trocada.");
}
function removerDaProva(qid){
  const p=S.prova;p.itens=p.itens.filter(q=>q.id!==qid);
  const ordem=p.montagem.filter(m=>m.qid!==qid).map(m=>itemDe(m.qid)).filter(Boolean);
  p.montagem=ordem.length?reletrar(ordem,p.nivel):null;
}
function distribuicao(m,nivel){const c=Array(NALT[nivel]).fill(0);m.forEach(x=>c[x.correta]++);return c;}

function comprimir(fonte,w,h,png){
  let max=1100,q=.86,data="";
  for(let t=0;t<8;t++){
    const r=Math.min(1,max/Math.max(w,h)),cw=Math.round(w*r),ch=Math.round(h*r);

    data=c.toDataURL("image/jpeg",q);if(data.length<=LIM_IMG)return {data,r:cw/ch};
    if(q>.6)q-=.1;else max*=.8;

}
function arquivoParaImagem(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error("tipo"));
    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>res(comprimir(im,im.naturalWidth,im.naturalHeight,/png|gif/.test(file.type)));im.src=fr.result;};
    fr.readAsDataURL(file);
  });
}
/* Gráficos para impressão: fundo branco, marcas finas, rótulos sempre visíveis */
const CAT=["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#4a3aa7","#e34948"];
const PB=[{bg:"#333"},{bg:"#fff",h:45},{bg:"#9a9a9a"},{bg:"#fff",h:135},{bg:"#d0d0d0"},{bg:"#fff",h:"x"},{bg:"#666"},{bg:"#fff",h:"dot"}];

function fmtNum(n){return Number.isInteger(n)?n.toLocaleString("pt-BR"):n.toLocaleString("pt-BR",{maximumFractionDigits:2});}
function escalaBonita(min,max){
  const span=(max-min)||Math.abs(max)||1;const passoBruto=span/5;const mag=Math.pow(10,Math.floor(Math.log10(passoBruto)));
  const passo=[1,2,2.5,5,10].map(m=>m*mag).find(v=>v>=passoBruto);

function linhasTexto(ctx,t,w){const pal=String(t).split(/\s+/);const out=[];let l="";pal.forEach(p=>{const tt=l?l+" "+p:p;if(ctx.measureText(tt).width>w&&l){out.push(l);l=p;}else l=tt;});if(l)out.push(l);return out;}
function desenharGrafico(g,op){op=op||{};if(op.semTitulo)g={...g,titulo:""};
  const dados=g.linhas.map(([r,v])=>[String(r||"").trim(),numero(v)]).filter(([r,v])=>r||v!=null);
  const W=1200,FONT='"Atkinson Hyperlegible",Arial,sans-serif',INK="#1b1b1b",MUTED="#555",GRID="#d6d6d6";
  const cor=g.pb?"#3a3a3a":CAT[0];
  let H=g.tipo==="tabela"?(g.titulo?90:30)+62*(dados.length+1)+24:720;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.textBaseline="alphabetic";
  let top=36;
  if(g.titulo){x.fillStyle=INK;x.font=`700 38px ${FONT}`;x.textAlign="center";linhasTexto(x,g.titulo,W-80).slice(0,2).forEach((l,i)=>x.fillText(l,W/2,58+i*44));top=g.titulo.length>50?130:96;}
  const vals=dados.map(d=>d[1]??0);
  if(!dados.length){x.fillStyle=MUTED;x.font=`28px ${FONT}`;x.textAlign="center";x.fillText("Preencha os dados",W/2,H/2);return c;}
  if(g.tipo==="tabela"){
    const tw=W-80,cx=40,rh=62,y0=top-6,col2=cx+tw*.62;
    const linhas=[[g.eixoX||"Item",g.eixoY||"Valor"],...dados.map(d=>[d[0],d[1]==null?"":fmtNum(d[1])+(g.unidade?" "+g.unidade:"")])];
    x.strokeStyle="#111";
    linhas.forEach((cel,i)=>{const yy=y0+i*rh;x.fillStyle=INK;x.font=`${i===0?700:400} 30px ${FONT}`;x.textAlign="left";x.fillText(String(cel[0]).slice(0,44),cx+14,yy+41);x.textAlign="center";x.fillText(String(cel[1]).slice(0,20),col2+(cx+tw-col2)/2,yy+41);});
    const lin=(yy,w)=>{x.lineWidth=w;x.beginPath();x.moveTo(cx,yy);x.lineTo(cx+tw,yy);x.stroke();};

    const lx=cx+r+60,lh=Math.min(62,(H-top-20)/Math.max(1,pos.length));let ly=cy-(pos.length*lh)/2+lh/2;

      x.fillStyle=INK;x.font=`30px ${FONT}`;x.textAlign="left";const pc=Math.round(d[1]/tot*1000)/10;

  // rótulos das categorias

    if(horiz){x.textAlign="right";const ls=linhasTexto(x,d[0],labW-20).slice(0,2);ls.forEach((l,k)=>x.fillText(l,L-14,T+m+9-(ls.length-1)*14+k*28));}
    else{x.textAlign="center";const ls=linhasTexto(x,d[0],band-8).slice(0,2);ls.forEach((l,k)=>x.fillText(l,L+m,B+36+k*28));}});

}

/* ============ Conversa: assistente de provas em formato de chat ============ */
const CHAT={msgs:[],d:{},perg:null,espera:null,digitando:false};
const hora=()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const semAcento=t=>String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const menuChips=()=>[{t:"Nova prova",a:"c-nova"},{t:"Minhas provas",a:"c-minhas"},{t:"Cadastrar questão",a:"c-questao"}];
function renderChat(){if(S.tab!=="inicio")return;render();requestAnimationFrame(()=>window.scrollTo(0,document.documentElement.scrollHeight));}
function chatEu(t){CHAT.msgs.push({de:"eu",html:esc(t),h:hora()});}
function chatBot(html,chips,extra){CHAT.digitando=true;renderChat();setTimeout(()=>{CHAT.digitando=false;CHAT.msgs.push({de:"bot",html,chips:chips||[],extra:extra||"",h:hora()});renderChat();},350);}
function iniciarChat(){
  if(CHAT.msgs.length)return;
  const nome=(S.perfil.professor||"").split(" ")[0];
  CHAT.msgs.push({de:"bot",html:`${nome?"Olá, "+esc(nome)+"!":"Olá!"} Eu monto a sua prova em poucos toques. O que vamos fazer?`,chips:menuChips(),h:hora()});
}
function vConversa(){
  iniciarChat();
  const ult=CHAT.msgs.length-1;
  return `${avisoModo()}<div class="chat" id="chat">${CHAT.msgs.map((m,i)=>`<div class="msg ${m.de}"><div class="bolha">${m.html}${m.extra||""}<span class="hora">${m.h}</span></div>${m.de==="bot"&&i===ult&&!CHAT.digitando&&m.chips.length?`<div class="chips resp">${m.chips.map(c=>`<button class="chip" data-a="${c.a}" data-v="${esc(c.v||"")}">${esc(c.t)}</button>`).join("")}</div>`:""}</div>`).join("")}${CHAT.digitando?`<div class="msg bot"><div class="bolha digitando" aria-label="Digitando"><i></i><i></i><i></i></div></div>`:""}</div>
  <form class="composer" id="composer"><input id="chat-txt" class="in" autocomplete="off" enterkeyhint="send" aria-label="Mensagem" placeholder="${CHAT.espera?esc(CHAT.espera.ph):"Ex.: Matemática, 6º ano, 10 questões"}"><button class="btn primary" aria-label="Enviar">${I.send}</button></form>`;
}
function perguntar(){
  const d=CHAT.d;
  if(!S.perfil.escola&&!d.pulouEscola){CHAT.perg="escola";CHAT.espera={campo:"escola",ph:"Nome da escola"};return chatBot("Qual é o nome da sua escola? Ele vai no cabeçalho da prova.",[{t:"Pular",a:"c-pular"}]);}
  CHAT.espera=null;
  if(!d.disciplina){const ds=disciplinasDoBanco();CHAT.perg="disciplina";
    if(!ds.length)return chatBot("O banco ainda não tem questões. Cadastre a primeira para montar provas.",[{t:"Cadastrar questão",a:"c-questao"}]);
    return chatBot("Qual disciplina?",ds.map(([n,c])=>({t:`${n} (${c})`,a:"c-resp",v:"disciplina|"+n})));}
  if(!d.serie){CHAT.perg="serie";const ops=[];["EF","EM"].forEach(nv=>SERIES[nv].forEach(se=>{const c=contar(q=>q.disciplina===d.disciplina&&q.nivel===nv&&q.serie===se);if(c)ops.push({t:`${se} (${c})`,a:"c-resp",v:`serie|${nv}|${se}`});}));
    return chatBot("Para qual série ou ano?",ops.length?ops:[{t:"Outra disciplina",a:"c-resp",v:"disciplina|"}]);}
  if(!d.bimestre){CHAT.perg="bimestre";return chatBot("Qual bimestre?",BIM.map(b=>({t:b,a:"c-resp",v:"bimestre|"+b})));}
  if(!d.qtd){CHAT.perg="qtd";return chatBot("Quantas questões?",[5,10,15,20].map(n=>({t:String(n),a:"c-resp",v:"qtd|"+n})));}
  if(d.aee==null){CHAT.perg="aee";return chatBot("É uma prova adaptada para estudantes do AEE?",[{t:"Não",a:"c-resp",v:"aee|0"},{t:"Sim, adaptada",a:"c-resp",v:"aee|1"}]);}
  CHAT.perg=null;gerarNoChat();
}
function responder(v){
  const [k,a,b]=String(v).split("|"),d=CHAT.d;
  if(k==="disciplina"){d.disciplina=a||"";d.serie=null;}
  else if(k==="serie"){d.nivel=a;d.serie=b;}
  else if(k==="bimestre")d.bimestre=a;
  else if(k==="qtd")d.qtd=+a;
  else if(k==="aee")d.aee=a==="1";
  perguntar();
}
function chatTexto(t){
  t=t.trim();if(!t)return;chatEu(t);
  const d=CHAT.d,n=semAcento(t);
  if(CHAT.espera&&CHAT.espera.campo==="escola"){salvarPerfil({escola:t});CHAT.espera=null;return perguntar();}
  if(/^(oi|ola|bom dia|boa tarde|boa noite|menu|inicio|ajuda)\b/.test(n)){CHAT.d={};CHAT.perg=null;return chatBot("O que vamos fazer?",menuChips());}
  let achou=false;
  if(CHAT.perg==="qtd"&&/^\d{1,2}$/.test(n)){d.qtd=Math.min(40,Math.max(1,+n));achou=true;}
  if(CHAT.perg==="bimestre"&&/^[1-4]$/.test(n)){d.bimestre=BIM[+n-1];achou=true;}
  if(CHAT.perg==="aee"&&/^(sim|s|nao|n)\b/.test(n)){d.aee=n[0]==="s";achou=true;}
  const disc=disciplinasDoBanco().map(x=>x[0]).find(x=>n.includes(semAcento(x)));
  if(disc){if(disc!==d.disciplina)d.serie=null;d.disciplina=disc;achou=true;}
  const ms=n.match(/(\d)\s*(?:o|º|ª|a)?\s*(ano|serie)/);
  if(ms){const nv=ms[2]==="ano"?"EF":"EM",se=nv==="EF"?ms[1]+"º ano":ms[1]+"ª série";if(SERIES[nv].includes(se)){d.nivel=nv;d.serie=se;achou=true;}}
  const mq=n.match(/(\d{1,2})\s*quest/);if(mq){d.qtd=Math.min(40,Math.max(1,+mq[1]));achou=true;}
  const mb=n.match(/([1-4])\s*(?:o|º)?\s*bim/);if(mb){d.bimestre=BIM[+mb[1]-1];achou=true;}
  if(/\baee\b|adaptad/.test(n)){d.aee=true;achou=true;}
  if(!achou&&/(nova|montar|criar|fazer|gerar)\b.*prova|^prova\b/.test(n)){CHAT.d={};return perguntar();}
  if(!achou)return chatBot("Não entendi. Escreva, por exemplo, <i>Matemática, 6º ano, 10 questões</i>, ou toque em uma opção.",menuChips());
  perguntar();
}
function gerarNoChat(){

  p.itens=res.sel;p.montagem=organizar(p.itens,p.nivel);S.passo=3;

}

function orientacoesAEE(aberto){
  return `<details class="orient" ${aberto?"open":""}><summary>Orientações para adaptar questões ao AEE</summary><ol>${ORIENT_AEE.map(([t,d])=>`<li><b>${t}.</b> ${d}</li>`).join("")}</ol></details>`;

function faltaAEE(){
  const p=S.prova;if(!p||!p.aee)return null;
  const pedidas=S.passo===2?S.auto.qtd:Math.max(S.auto.qtd,p.itens.length);
  const adapt=p.itens.filter(q=>q.aee).length;
  const semAdapt=p.itens.length-adapt;
  const faltam=Math.max(0,pedidas-p.itens.length);
  const nenhuma=S._msg&&S._msg.aee;
  if(!faltam&&!semAdapt&&!nenhuma)return null;
  return {pedidas,adapt,semAdapt,faltam,nenhuma};
}
function painelAEE(passo){
  const f=faltaAEE();if(!f)return "";
  if(passo===2&&!f.nenhuma&&!S.prova.itens.length)return "";
  const p=S.prova;
  const origem=filtrarBase(p,S.auto.mesmaSerie,S.auto.conteudos).filter(q=>!q.aee&&!p.itens.some(i=>i.id===q.id||i.origemId===q.id)).length;
  const partes=[];
  if(f.faltam) partes.push(`faltam <b>${f.faltam}</b> ${f.faltam===1?"questão":"questões"} para chegar às ${f.pedidas} pedidas`);
  if(f.semAdapt) partes.push(`<b>${f.semAdapt}</b> ${f.semAdapt===1?"questão selecionada é fácil, mas não foi adaptada":"questões selecionadas são fáceis, mas não foram adaptadas"} para o AEE`);
  return `<details class="card aeebox" ${DICAS.has("aee-painel")?"open":""}><summary><span class="pill aee">AEE</span><b>Poucas questões adaptadas</b><span class="pill d2">${f.nenhuma?"nenhuma":(f.faltam?"faltam "+f.faltam:f.semAdapt+" sem adaptação")}</span></summary>
    <div class="stack">
    <p class="small">${f.nenhuma?"Ainda não há questões para o perfil do AEE com esses filtros.":"Nesta prova, "+partes.join(" e ")+"."} Você pode completar assim:</p>
    <div class="stack" style="gap:8px">
      <button class="opt" data-a="aee-adaptar" ${origem?"":"disabled"}>${I.wand}<span><b>Adaptar uma questão do banco</b><span>${origem?`${origem} ${origem===1?"questão":"questões"} deste conteúdo podem ser simplificadas. A original continua no banco.`:"Não há outras questões deste conteúdo para adaptar."}</span></span></button>
      <button class="opt" data-a="aee-escrever">${I.pen}<span><b>Escrever uma questão adaptada</b><span>Editor já marcado como AEE e fácil</span></span></button>
      ${passo===2&&S.auto.mesmaSerie?`<button class="opt" data-a="aee-series">${I.bank}<span><b>Buscar em outras séries</b><span>Inclui questões do AEE e fáceis de outras séries do ${NIVEL_NOME[p.nivel]}.</span></span></button>`:""}
    </div>
    ${orientacoesAEE(false)}
  </div></details>`;
}

async function sugerirAdaptacao(btn){
  const {d,origem}=S._ed;if(!S.sample||!origem)return;
  lerEditor();btn.disabled=true;const txt=btn.innerHTML;btn.innerHTML="Pensando…";
  const n=NALT[d.nivel];
  const pedido=`Você é professor(a) do Atendimento Educacional Especializado (AEE) no Brasil. Adapte a questão de múltipla escolha abaixo para estudantes público do AEE (${d.serie}, ${NIVEL_NOME[d.nivel]}, ${d.disciplina}, conteúdo: ${d.conteudo}).
Regras: mantenha a MESMA habilidade e a mesma resposta correta; uma habilidade por questão; comando curto e no início, começando pelo verbo; frases curtas em ordem direta; vocabulário do dia a dia; texto-base reduzido ao essencial; destaque a palavra-chave em MAIÚSCULAS; não use "exceto", "incorreta", dupla negação nem "todas as anteriores"; exatamente ${n} alternativas curtas e bem diferentes entre si; números menores quando for Matemática. Escreva em português do Brasil.
Questão original:
Enunciado: ${origem.enunciado}
Alternativas: ${origem.alternativas.map((a,i)=>LET[i]+") "+a).join(" | ")}
Correta: ${LET[origem.correta]}${origem.grafico||origem.temFoto?"\nA questão tem uma imagem ou gráfico que continuará na versão adaptada: faça o enunciado se referir a ela (\"Observe a imagem\"), sem descrevê-la de novo.":""}
Responda só com JSON: {"enunciado": string, "alternativas": [${n} strings, sem a letra], "correta": índice de 0 a ${n-1}}`;
  try{
    const r=await S.sample.json(pedido);
    if(!r||typeof r.enunciado!=="string"||!Array.isArray(r.alternativas)||r.alternativas.length!==n||!Number.isInteger(r.correta)||r.correta<0||r.correta>=n) throw {code:"formato"};
    d.enunciado=r.enunciado.trim();d.alternativas=r.alternativas.map(x=>String(x).replace(/^[A-E]\)\s*/,"").trim());d.correta=r.correta;
    desenharEditor();toast("Sugestão pronta. Revise antes de salvar.");
  }catch(e){
    btn.disabled=false;btn.innerHTML=txt;
    if(e&&e.code==="not_granted"){S.sample=null;desenharEditor();toast("Sugestão automática não autorizada.");}
    else if(e&&e.code==="rate_limited")toast("Muitos pedidos seguidos. Tente em alguns minutos.");
    else toast("Não foi possível gerar a sugestão. Adapte manualmente com as orientações.");
  }
}

/* ============ Logo ============ */
function lerLogo(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
      const max=360,r=Math.min(1,max/Math.max(img.width,img.height));const w=Math.round(img.width*r),h=Math.round(img.height*r);
      const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      res({logo:c.toDataURL("image/jpeg",.88),logoR:w/h});};img.src=fr.result;};
    fr.readAsDataURL(file);
  });
}

/* ============ PDF ============ */
function gerarPDF(p,midiaFn){midiaFn=midiaFn||midia;
  /* ABNT NBR 14724: A4, margens 3 cm (sup./esq.) e 2 cm (inf./dir.), fonte 12, entrelinha 1,5,
     numeração no canto superior direito, ilustrações com identificação acima e fonte abaixo (tamanho menor). */
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});
  const PW=210,PH=297,ML=30,MR=20,MT=30,MB=20,W=PW-ML-MR,B=p.bastao,pt=.3528;
  const up=s=>B?String(s).toLocaleUpperCase("pt-BR"):String(s);
  const fs=B?14:12,lh=fs*pt*1.5,fsP=B?11:10,lhP=fsP*pt*1.25;
  const quebrar=(t,w)=>{const out=[];String(t).split(/\n/).forEach(par=>{const ls=doc.splitTextToSize(par,w);if(!ls.length)ls.push("");ls.forEach((l,i)=>out.push({t:l,ult:i===ls.length-1}));});return out;};
  const justificar=(l,x,yy,w)=>{const pal=l.t.trim().split(/\s+/).filter(Boolean);
    if(l.ult||pal.length<2){doc.text(l.t,x,yy);return;}
    const larg=pal.reduce((s,q)=>s+doc.getTextWidth(q),0);const esp=(w-larg)/(pal.length-1);
    if(esp>doc.getTextWidth(" ")*4){doc.text(l.t,x,yy);return;}
    let cx=x;pal.forEach(q=>{doc.text(q,cx,yy);cx+=doc.getTextWidth(q)+esp;});};
  let y=MT;
  /* ---- Cabeçalho institucional ---- */
  const lw=p.logo?22:0,tx=ML+(p.logo?27:0),tw=W-(p.logo?27:0);
  if(p.logo){let w=22,h=22/(p.logoR||1);if(h>22){h=22;w=22*(p.logoR||1);}try{doc.addImage(p.logo,"JPEG",ML+(22-w)/2,y-4+(22-h)/2,w,h);}catch(e){}}
  doc.setFont("helvetica","bold");doc.setFontSize(12);
  const nome=doc.splitTextToSize(String(p.escola||"").toLocaleUpperCase("pt-BR"),tw).slice(0,2);
  doc.text(nome,tx,y+1);let hy=y+1+nome.length*5;
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(85);
  doc.text(`${p.disciplina}  ·  ${p.bimestre}`,tx,hy+.5);doc.text(`${p.serie} – ${NIVEL_NOME[p.nivel]}`,tx,hy+5.3);doc.setTextColor(0);
  y=Math.max(y+lw-2,hy+9);
  doc.setDrawColor(20);doc.setLineWidth(.6);doc.line(ML,y,ML+W,y);
  y+=8;doc.setFontSize(10);
  const campo=(rot,x,yy,w,val)=>{doc.setFont("helvetica","bold");doc.text(rot,x,yy);const t=doc.getTextWidth(rot)+2;doc.setDrawColor(120);doc.setLineWidth(.2);doc.line(x+t,yy+1.2,x+w,yy+1.2);if(val){doc.setFont("helvetica","normal");doc.text(up(val),x+t+1,yy);}};
  campo("Professor(a):",ML,y,W,p.professor);y+=8.5;
  campo("Estudante:",ML,y,W,"");y+=8.5;
  const c3=(W-12)/3;campo("Turma:",ML,y,c3,"");campo("Data:",ML+c3+6,y,c3,"");campo("Nota:",ML+2*(c3+6),y,c3,"");
  y+=5;doc.setDrawColor(20);doc.setLineWidth(.25);doc.line(ML,y,ML+W,y);
  /* ---- Título (sem indicativo numérico: centralizado, negrito) ---- */
  y+=11;doc.setFont("helvetica","bold");doc.setFontSize(fs);
  const tit=doc.splitTextToSize(`AVALIAÇÃO DE ${p.disciplina} – ${p.bimestre}`.toLocaleUpperCase("pt-BR"),W);
  tit.forEach(l=>{doc.text(l,ML+W/2,y,{align:"center"});y+=lh;});
  if(p.instrucoes){doc.setFontSize(fsP);doc.setFont("helvetica","bold");doc.text(up("Instruções:"),ML,y);doc.setFont("helvetica","normal");
    const ins=quebrar(up(p.instrucoes),W);ins.forEach(l=>{y+=lhP;justificar(l,ML,y,W);});y+=lh;}
  else y+=lh*.3;
  doc.setFontSize(fs);
  /* ---- Questões ---- */
  const C2=p.colunas===2,gap=8,colW=C2?(W-gap)/2:W,lim=PH-MB;
  let col=0,topo=y;const topos={1:y};
  const novaPag=()=>{doc.addPage();y=MT;topo=y;topos[doc.getNumberOfPages()]=y;doc.setFontSize(fs);};
  const avancar=()=>{if(C2&&col===0){col=1;y=topo;}else{col=0;novaPag();}};
  const X=()=>ML+(col?colW+gap:0);
  const ind=B?9:7,indA=B?8:7;
  const rot=numerarFiguras(p.montagem);
  p.montagem.forEach((m,i)=>{
    doc.setFontSize(fs);doc.setFont("helvetica","normal");
    const en=quebrar(up(m.enunciado),colW-ind);
    const alts=m.alternativas.map(a=>quebrar(up(a),colW-ind-indA));
    const md=(m.grafico||m.temFoto)?midiaFn(m):null,im=md&&md.data,vazio=m.temFoto&&!im;
    let fig=null;
    if(im||vazio){
      const cw=colW-ind;let iw,ih;
      if(im){const r=md.r||1.5,maxW=Math.min(cw,C2?cw:125),maxH=C2?68:85;iw=maxW;ih=iw/r;if(ih>maxH){ih=maxH;iw=ih*r;}}else{iw=Math.min(cw,110);ih=35;}
      doc.setFontSize(fsP);
      const t=tituloFig(m),fo=fonteFig(m);
      const capT=doc.splitTextToSize(up(`${rot[i]}${t?" – "+t:""}`),Math.max(iw,60));
      const capF=fo?doc.splitTextToSize(up("Fonte: "+fo),Math.max(iw,60)):[];
      doc.setFontSize(fs);
      fig={iw,ih,capT,capF,alt:capT.length*lhP+2+ih+2+capF.length*lhP+2};
    }
    const h=en.length*lh+(fig?fig.alt:0)+lh*.25+alts.reduce((s,a)=>s+a.length*lh,0)+lh*.6;
    if(y+h-lh>lim&&y>topo+2)avancar();
    const escreve=(linhas,dx,w)=>{linhas.forEach(l=>{if(y>lim)avancar();justificar(l,X()+dx,y,w);y+=lh;});};
    doc.setFont("helvetica","bold");doc.text(`${i+1}.`,X(),y);doc.setFont("helvetica","normal");escreve(en,ind,colW-ind);
    if(fig){
      let top=y-lh+lhP+1;
      if(top+fig.alt>lim+2){avancar();top=y-fs*pt;}
      const fx=X()+ind+(colW-ind-fig.iw)/2;
      doc.setFontSize(fsP);fig.capT.forEach((l,k)=>{doc.setFont("helvetica",k===0?"normal":"normal");doc.text(l,fx,top+k*lhP);});
      let iy=top+(fig.capT.length-1)*lhP+2;
      if(im){try{doc.addImage(im,im.startsWith("data:image/png")?"PNG":"JPEG",fx,iy,fig.iw,fig.ih,"q"+(m.qid||i),"FAST");}catch(e){console.warn(e);}}
      else{doc.setDrawColor(150);doc.setLineWidth(.3);doc.setLineDashPattern([1.5,1.5],0);doc.rect(fx,iy,fig.iw,fig.ih);doc.setLineDashPattern([],0);doc.setTextColor(140);doc.text("Espaço para a imagem",fx+fig.iw/2,iy+fig.ih/2+1,{align:"center"});doc.setTextColor(0);doc.setDrawColor(0);}
      let fy=iy+fig.ih+lhP;fig.capF.forEach(l=>{doc.text(l,fx,fy);fy+=lhP;});
      doc.setFontSize(fs);y=fy-lhP+lh;
    }
    y+=lh*.25;
    alts.forEach((a,j)=>{if(y>lim)avancar();doc.setFont("helvetica","bold");doc.text(`${LET[j]})`,X()+ind,y);doc.setFont("helvetica","normal");escreve(a,ind+indA,colW-ind-indA);});
    y+=lh*.6;
  });
  const nProva=doc.getNumberOfPages();
  if(C2){doc.setDrawColor(170);doc.setLineWidth(.25);for(let pg=1;pg<=nProva;pg++){doc.setPage(pg);const xm=ML+colW+gap/2;doc.line(xm,(topos[pg]||MT)-5,xm,lim);}doc.setPage(nProva);}
  /* ---- Gabarito em folha separada ---- */
  if(p.incluirGab){
    doc.addPage();y=MT;
    doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text("GABARITO",ML+W/2,y,{align:"center"});
    doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(90);doc.text("Uso exclusivo do(a) professor(a). Retire esta folha antes de imprimir para os estudantes.",ML+W/2,y+6,{align:"center"});doc.setTextColor(0);
    y+=16;doc.setFontSize(10);

  }

  const tot=doc.getNumberOfPages();

      const lin=S._banco.map(q=>[q.id,q.disciplina,q.nivel,q.serie,q.conteudo,DIF[q.dificuldade],q.aee?"sim":"não",q.enunciado,...[0,1,2,3,4].map(i=>(q.alternativas||[])[i]||""),LET[q.correta],q.autorId,q.criadoEm].map(cel).join(";"));
      await baixar("banco-senov-questoes.csv","﻿"+cols.join(";")+"\n"+lin.join("\n"));break;}
    case "rem-exemplos":confirmar("Remover questões de exemplo?","As questões marcadas como Exemplo serão apagadas do banco.","Remover",async()=>{for(const q of S.questoes.filter(x=>x.exemplo)){try{await S.db.doc("questoes/"+q.id).delete();}catch(e){}}toast("Exemplos removidos.");});break;
  }
});
function validarP1(){const p=S.prova;if(!p.disciplina){toast("Informe a disciplina.");const i=$("#p-disc");i&&i.focus();return false;}return true;}

document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="busca"){S.f.busca=t.value;lembrar();clearTimeout(S._bt);S._bt=setTimeout(render,250);}
});
document.addEventListener("change",async ev=>{
  const t=ev.target;
  if(t.id==="f-nivel"){S.f.nivel=t.value;lembrar();render();}
  if(t.id==="f-disc"){S.f.disciplina=t.value;lembrar();render();}
  if(t.id==="f-dif"){S.f.dif=t.value;lembrar();render();}
  if(t.id==="a-serie"){lerPasso2();render();}
  if(t.id==="p-gab"&&S.prova){S.prova.incluirGab=t.checked;render();}
  if(t.id==="p-aee"&&S.prova){lerPasso2();S.prova.aee=t.checked;S._msg=null;if(S.prova.aee&&!S.prova.bastao){S.prova.bastao=true;toast("Letra bastão será usada na folha. Você pode mudar em Organizar.");}render();}
  if(t.id==="r-aee"){RAP.aee=t.checked;S._msgRap=null;lembrarRap();render();}
  if(t.id==="p-bastao"&&S.prova){S.prova.bastao=t.checked;render();}
  if(t.id==="ed-aee"&&S._ed){lerEditor();desenharEditor();}
  if(t.id==="ed-disc"&&S._ed){lerEditor();const dl=$("#dl-cont");if(dl)dl.innerHTML=conteudosDe(S._ed.d.disciplina,"","").map(x=>`<option value="${esc(x)}">`).join("");}
  if(t.id==="ed-img-file"&&t.files&&t.files[0]&&S._ed){
    lerEditor();try{const r=await arquivoParaImagem(t.files[0]);S._ed.foto=r;S._ed.d.grafico=null;S._ed.d.temFoto=true;desenharEditor();}catch(e){toast("Não foi possível ler a imagem. Use JPG ou PNG.");}
  }
  if(t.id==="imp-file"&&t.files&&t.files[0]&&S.db){
    try{const arr=JSON.parse(await t.files[0].text());if(!Array.isArray(arr))throw 0;let n=0;
      for(const q of arr){if(!q||typeof q.enunciado!=="string"||!Array.isArray(q.alternativas))continue;const {id,privada,...rest}=q;await S.db.doc("questoes/"+(id&&/^[\w-]+$/.test(id)?id:Date.now().toString(36)+n)).set(rest);n++;}
      toast(n===1?"1 questão importada.":n+" questões importadas.");}catch(e){toast("Arquivo inválido. Use o JSON exportado pelo ChatSenov.");}
    t.value="";
  }
  if(t.id==="anexar-file"&&t.files&&t.files[0]&&S._anexarId){
    try{S.fotos[S._anexarId]=await arquivoParaImagem(t.files[0]);toast("Imagem anexada a esta prova.");render();}catch(e){toast("Não foi possível ler a imagem. Use JPG ou PNG.");}
    t.value="";
  }
  if(t.id==="logo-file"&&t.files&&t.files[0]){
    try{const r=await lerLogo(t.files[0]);
      if(S._logoAlvo==="logo-prova"&&S.prova){lerPasso1();Object.assign(S.prova,r);if(!S.perfil.logo)salvarPerfil(r);}else{await salvarPerfil(r);toast("Logo salva.");}
      render();}catch(e){toast("Não foi possível ler a imagem.");}
  }
});
document.addEventListener("input",ev=>{if(ev.target.id&&ev.target.id.startsWith("gr-")&&S._gr){lerGrafico();clearTimeout(S._gt);S._gt=setTimeout(atualizarPrevGrafico,200);}});
document.addEventListener("change",ev=>{if((ev.target.id==="gr-pb"||ev.target.id==="gr-val")&&S._gr){lerGrafico();atualizarPrevGrafico();}});
document.addEventListener("paste",async ev=>{
  if(!S._ed||!$("#ed-en"))return;const it=[...(ev.clipboardData&&ev.clipboardData.items||[])].find(i=>i.type.startsWith("image/"));if(!it)return;
  ev.preventDefault();lerEditor();try{const r=await arquivoParaImagem(it.getAsFile());S._ed.foto=r;S._ed.d.grafico=null;S._ed.d.temFoto=true;desenharEditor();toast("Imagem colada na questão.");}catch(e){toast("Não foi possível usar a imagem colada.");}
});
document.addEventListener("submit",ev=>{if(ev.target.id==="composer"){ev.preventDefault();const i=$("#chat-txt");const t=i.value;i.value="";chatTexto(t);}});
document.addEventListener("toggle",ev=>{if(ev.target.classList&&ev.target.classList.contains("aeebox")){ev.target.open?DICAS.add("aee-painel"):DICAS.delete("aee-painel");}if(ev.target.id==="qdet"){S._qopen=ev.target.open;}},true);
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&$("#layer").innerHTML){fecharSheet();}
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches('[role="button"][data-a]')){ev.preventDefault();ev.target.click();}
});
document.documentElement.lang="pt-BR";
let ZOOM=1;
function aplicarZoom(v){ZOOM=[1,1.1,1.2].includes(+v)?+v:1;document.documentElement.style.zoom=ZOOM===1?"":String(ZOOM);try{localStorage.setItem("senov.zoom",String(ZOOM));}catch(e){}}
try{aplicarZoom(localStorage.getItem("senov.zoom")||1);}catch(e){}
iniciar();
</script>
